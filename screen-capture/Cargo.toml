[package]
name = "screen-capture"
version = "0.1.0"
edition = "2021"

[lib]
name = "screen_capture_lib"
crate-type = ["cdylib"]

[[bin]]
name = "screen_capture_app"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.38" }
clap = { version = "4.0", features = ["derive"]}

[dependencies.windows]
version = "0.58.0"
features = [
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",

    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
]
